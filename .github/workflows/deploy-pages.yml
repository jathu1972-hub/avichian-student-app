name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-student
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          VITE_BASE: /avichian-student-app/
          # Do NOT inject stale VITE_API_URL from repo vars — it overwrote public/config.json.
          # Runtime API URL comes only from public/config.json after build.
        run: npm run build
      - name: Verify production config.json
        run: |
          test -f dist/config.json
          echo "Shipped config.json:"
          cat dist/config.json
          if grep -qiE 'localhost|127\.0\.0\.1' dist/config.json; then
            echo "ERROR: config.json must not contain localhost" >&2
            exit 1
          fi
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
