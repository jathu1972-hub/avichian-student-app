# Student App — monorepo Netlify site
# Base directory in Netlify UI: apps/student-app
# Or connect standalone repo: https://github.com/jathu1972-hub/avichian-student-app

[build]
  command = "cd ../.. && npm ci && npm run build -w @avichian/shared && npm run build -w @avichian/student-app"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
